ard">

<form autocomplete="on" id="referralForm">
<h2 class="form-section-title">Referrer Details</h2>
<div class="referral-fields">
<label class="field"><span>Referrer Name</span><small class="field-hint">As per PAN Card</small><input autocomplete="name" maxlength="100" name="referrerName" required="" type="text"/></label>
<label class="field"><span>Referrer DSA Code</span><small class="field-hint">Find on FastPay</small><input maxlength="50" name="referrerDsaCode" required="" type="text"/></label>
<label class="field"><span>Referrer Mobile</span><small class="field-hint">Registered on FastPay</small><input autocomplete="tel-national" inputmode="numeric" maxlength="10" name="referrerMobile" pattern="[6-9][0-9]{9}" placeholder="10-digit mobile number" required="" type="tel"/></label>
<label class="field"><span>Referrer Email</span><small class="field-hint">As per FastPay</small><input autocomplete="email" maxlength="180" name="referrerEmail" required="" type="email"/></label>
<label class="field"><span>Referrer City</span><input autocomplete="address-level2" maxlength="100" name="referrerCity" required="" type="text"/></label>
</div>
<h2 class="form-section-title">Details of Your referral</h2>
<div class="referral-fields">
<label class="field"><span>Referred Loan Partner Name</span><small class="field-hint">As Per PAN Card</small><input maxlength="100" name="referredName" required="" type="text"/></label>
<label class="field"><span>Referred Mobile</span><small class="field-hint">Same number to be used while FastPay Registration</small><input inputmode="numeric" maxlength="10" name="referredMobile" pattern="[6-9][0-9]{9}" placeholder="10-digit mobile number" required="" type="tel"/></label>
<label class="field"><span>Referred Email</span><small class="field-hint">Same email to be used while FastPay Registration</small><input maxlength="180" name="referredEmail" required="" type="email"/></label>
</div>
<label class="consent-field"><input name="consent" required="" type="checkbox"/><span>I confirm that I have the referred person's permission to share their contact details with NoBroker Loans.</span></label>
<button class="btn btn-red full-width" id="submitReferral" type="submit">Continue to submit <span aria-hidden="true">↗</span></button>
<p aria-live="polite" class="small fineprint" id="referralFeedback" role="status"></p>
</form>

</div></div></section></main><footer><div class="container footer-inner"><span>NoBroker Loans</span><span>Helping partners grow, together.</span></div></footer><script src="/config.js"></script><script src="/form.js" defer></script></body></html>
