<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Loan Partner Referral | NoBroker Loans</title><link rel="stylesheet" href="/styles.css"></head><body><header class="header"><div class="wrap head"><a href="/landing" class="brand"><img src="/assets/nbl-logo.png" alt="NoBroker Loans" onerror="this.hidden=true;document.getElementById('brandRequired').hidden=false"><strong id="brandRequired" hidden>NoBroker Loans</strong></a></div></header><main class="wrap form-page"><h1>Refer a Loan Partner.</h1><p id="formMessage" role="status">Checking referral link…</p><form id="referralForm" hidden><div class="form-grid"><label>Your full name<input required name="referrerName" maxlength="100" autocomplete="name"></label><label>Your registered mobile number<input required name="referrerMobile" type="tel" pattern="[6-9][0-9]{9}" maxlength="10" inputmode="numeric"></label><label>Your email address<input required name="referrerEmail" type="email" maxlength="180"></label><label>Your city<input required name="referrerCity" maxlength="100"></label><label>Referred Loan Partner's full name<input required name="referredName" maxlength="100"></label><label>Referred Loan Partner's mobile number<input required name="referredMobile" type="tel" pattern="[6-9][0-9]{9}" maxlength="10" inputmode="numeric"></label><label>Referred Loan Partner's email address<input required name="referredEmail" type="email" maxlength="180"></label></div><label class="consent"><input type="checkbox" name="consent" required> I confirm I have the referred person's permission to share their contact details with NoBroker Loans.</label><button class="btn" type="submit">Continue to submit</button></form></main><footer class="wrap foot">NoBroker Loans · Your Partner in Growth.</footer><script type="module" src="/form.js"></script></body></html>
