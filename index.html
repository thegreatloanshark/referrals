<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#d80000"><meta name="description" content="NoBroker Loans partner referral program."><title>Referral tools | NoBroker Loans</title><link rel="stylesheet" href="/styles.css"></head><body><header class="site-header"><div class="container header-inner"><a class="wordmark" href="/" aria-label="NoBroker Loans"><img src="/assets/nbl-logo.png" alt="NoBroker Loans" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"><span class="brand-fallback" style="display:none">NoBroker Loans</span></a><nav class="header-nav"><a class="header-link" href="/form/">Referral form</a><a class="header-link" href="/landing/">About</a></nav></div></header><main><section class="section section-white home-tools" id="tools"><div class="container tool-grid">
<div class="tool-intro"><p class="eyebrow">Your Partner in Growth.</p><h2>Personalize your referral creative.</h2><p class="muted">Identify your profile, then create your referral link, QR code and personalized campaign creative.</p>
<div class="profile-card"><label class="field" for="lookupPhone"><span>Registered mobile number</span><input id="lookupPhone" type="tel" inputmode="numeric" maxlength="10" autocomplete="tel" placeholder="10-digit number"></label><button type="button" id="lookupProfile" class="btn btn-red profile-lookup">Continue</button><p id="profileMessage" class="small muted" role="status" aria-live="polite"></p><div id="profileFound" hidden><strong id="profileName"></strong><span id="profileDesignationText"></span></div></div>
</div>
<div class="tool-card">
<form autocomplete="off" id="builderForm"><div class="creative-profile"><label class="field"><span>Designation</span><input id="designation" maxlength="65" value="Vertical Head" type="text"></label><label class="field"><span>Photograph</span><input id="profilePhoto" accept="image/png,image/jpeg,image/webp" type="file"></label></div>
<div class="field-grid">
<label class="field"><span>Vertical Head name</span><input id="headName" maxlength="60" placeholder="e.g. Pawan" required="" type="text"/></label>
<label class="field"><span>Referral code</span><input id="headCode" maxlength="48" pattern="[A-Za-z0-9_-]+" placeholder="e.g. pawan" required="" type="text"/></label>
<label class="field"><span>UTM source</span><input id="utmSource" maxlength="80" type="text" value="partner_referral"/></label>
<label class="field"><span>UTM medium</span><input id="utmMedium" maxlength="80" type="text" value="whatsapp"/></label>
<label class="field"><span>UTM campaign</span><input id="utmCampaign" maxlength="100" type="text" value="loan_partner_referral"/></label>
<label class="field"><span>UTM content <small>(optional)</small></span><input id="utmContent" maxlength="100" placeholder="e.g. pilot_nov" type="text"/></label>
</div>
<div class="field output-field"><label for="generatedLink">Referral URL</label><div class="url-row"><input aria-label="Generated referral URL" id="generatedLink" readonly=""/><button class="mini-btn" id="copyGenerated" type="button">Copy</button></div></div>
<div class="qr-tools"><div class="qr-preview"><div aria-label="QR code for generated referral link" id="qrCode"></div></div><div class="qr-actions"><p class="small muted" id="linkHint">Enter a name and referral code to create a link.</p><button class="btn btn-dark" disabled="" id="downloadQR" type="button">Download QR</button><button class="btn btn-red" disabled="" id="downloadCreative" type="button">Download creative</button><button class="share-text-btn" disabled="" id="shareWhatsApp" type="button">Share on WhatsApp ↗</button></div></div>
<p aria-live="polite" class="small tool-feedback" id="toolFeedback" role="status"></p>
</form>
</div>
</div></section></main><footer><div class="container footer-inner"><span>NoBroker Loans</span><span>Your Partner in Growth.</span></div></footer><script src="/config.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script><script src="/tools.js" defer></script></body></html>
